<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>混沌夺宝</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; font-family:'Microsoft YaHei',sans-serif; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── 画布初始化 ──────────────────────────────────────────
const c = document.getElementById('c');
const g = c.getContext('2d');
const GW = 900, GH = 560;

function resize() {
  const s = Math.min(window.innerWidth / GW, window.innerHeight / GH);
  c.style.width  = (GW * s) + 'px';
  c.style.height = (GH * s) + 'px';
  c.width  = GW;
  c.height = GH;
}
resize();
window.addEventListener('resize', resize);

// ── 常量 ────────────────────────────────────────────────
const TAU = Math.PI * 2;
const GDUR = 300;

// ── 键盘输入 ────────────────────────────────────────────
const KEY = {};
let spacePushed = false;
window.addEventListener('keydown', e => {
  KEY[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); spacePushed = true; }
});
window.addEventListener('keyup', e => { KEY[e.code] = false; });

// 技能按钮（移动端）
const skillDiv = document.createElement('div');
Object.assign(skillDiv.style, {
  position:'fixed', right:'24px', bottom:'24px',
  width:'66px', height:'66px', borderRadius:'50%',
  background:'rgba(255,200,50,0.15)', border:'3px solid rgba(255,200,50,0.7)',
  color:'#ffc832', fontSize:'11px', fontWeight:'bold',
  display:'flex', alignItems:'center', justifyContent:'center',
  cursor:'pointer', userSelect:'none', flexDirection:'column',
  fontFamily:'Microsoft YaHei,sans-serif', textAlign:'center', lineHeight:'1.4',
  zIndex:'999'
});
skillDiv.innerHTML = '技能<br>SPACE';
document.body.appendChild(skillDiv);
skillDiv.addEventListener('click', () => { spacePushed = true; });

// ── 工具函数 ─────────────────────────────────────────────
function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function dist2(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

function rrect(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x+r, y);
  g.arcTo(x+w, y,   x+w, y+h, r);
  g.arcTo(x+w, y+h, x,   y+h, r);
  g.arcTo(x,   y+h, x,   y,   r);
  g.arcTo(x,   y,   x+w, y,   r);
  g.closePath();
}

// ── 背景星星（固定） ──────────────────────────────────────
const STARS = [];
for (let i = 0; i < 110; i++) {
  STARS.push({ x: rnd(0, GW), y: rnd(0, GH), r: rnd(0.3, 1.4), a: rnd(0.1, 0.5) });
}

// ── 卡牌定义 ─────────────────────────────────────────────
const RC = { C:'#aaa', R:'#4af', E:'#b56bff', L:'#ffd700' };
const RL = { C:'普通', R:'稀有', E:'史诗', L:'传说' };
const CARDS = [
  { id:'a1', n:'剑意凝聚', r:'C', i:'⚔️', d:'攻击力 +15%',         fn: p => { p.atk *= 1.15; } },
  { id:'a2', n:'疾风步法', r:'C', i:'💨', d:'移动速度 +15%',       fn: p => { p.spd *= 1.15; } },
  { id:'a3', n:'铁甲淬炼', r:'C', i:'🛡️', d:'最大HP+20%，回复15HP', fn: p => { p.mhp *= 1.2; p.hp = Math.min(p.hp+15, p.mhp); } },
  { id:'a4', n:'聚气疾攻', r:'C', i:'⚡', d:'攻击间隔 -20%',       fn: p => { p.atkCD *= 0.8; } },
  { id:'a5', n:'感悟天道', r:'C', i:'✨', d:'经验获取 +30%',        fn: p => { p.expM *= 1.3; } },
  { id:'a6', n:'破风箭',   r:'C', i:'🏹', d:'子弹速度 +25%',        fn: p => { p.bspd *= 1.25; } },
  { id:'b1', n:'吸血战意', r:'R', i:'🩸', d:'每次击杀回复 3HP',     fn: p => { p.lifesteal += 3; } },
  { id:'b2', n:'弹幕化',   r:'R', i:'🌀', d:'子弹变3发散射',        fn: p => { p.shots = Math.min(p.shots + 2, 7); } },
  { id:'b3', n:'爆裂子弹', r:'R', i:'💥', d:'子弹命中爆炸AOE',      fn: p => { p.explode = true; } },
  { id:'b4', n:'符文护盾', r:'R', i:'🔮', d:'每15秒获得免伤护盾',   fn: p => { p.shieldCD = 15; p.shieldT = 15; } },
  { id:'b5', n:'法力涌动', r:'R', i:'🌊', d:'技能CD -25%',          fn: p => { p.dashCD *= 0.75; } },
  { id:'b6', n:'斗气环绕', r:'R', i:'🌟', d:'每1.5秒周围小AOE',     fn: p => { p.aura = true; p.auraT = 0; } },
  { id:'c1', n:'残影分身', r:'E', i:'👥', d:'冲刺后留下AOE残影',    fn: p => { p.shadowDash = true; } },
  { id:'c2', n:'千羽流星', r:'E', i:'🌠', d:'子弹穿透所有敌人',     fn: p => { p.pierce = true; } },
  { id:'c3', n:'死亡爆破', r:'E', i:'💣', d:'击杀触发范围爆炸',     fn: p => { p.deathBurst = true; } },
  { id:'c4', n:'星轨护体', r:'E', i:'🪐', d:'召唤轨道球攻击敌人',   fn: p => { p.orbs++; } },
  { id:'c5', n:'生生不息', r:'E', i:'💚', d:'每5秒自动回复5HP',     fn: p => { p.regen = true; p.regenT = 5; } },
  { id:'c6', n:'嗜血狂怒', r:'E', i:'🔥', d:'血量越低攻击越高',     fn: p => { p.berserk = true; } },
  { id:'d1', n:'寒冰领域', r:'L', i:'🧊', d:'每12秒冰冻全场3秒',    fn: p => { p.freezeCD = 12; p.freezeT = 12; } },
  { id:'d2', n:'雷神之怒', r:'L', i:'⚡', d:'击杀30%概率闪电链',    fn: p => { p.lightning = true; } },
];
const CARD_W = { C:30, R:24, E:13, L:3 };

function pickCards(n) {
  const pool = [];
  CARDS.forEach(cd => { for (let i = 0; i < (CARD_W[cd.r]||5); i++) pool.push(cd); });
  const res = [], used = new Set();
  for (let t = 0; res.length < n && t < 500; t++) {
    const cd = pool[Math.floor(Math.random() * pool.length)];
    if (!used.has(cd.id)) { used.add(cd.id); res.push(cd); }
  }
  return res;
}

// ── 游戏状态 ─────────────────────────────────────────────
let gs = 'playing';
let gtime = 0, frame = 0;
let shakeT = 0, flashT = 0;

// 玩家
let P = {};
function resetPlayer() {
  P = {
    x: GW/2, y: GH/2, r: 14,
    hp: 90, mhp: 90,
    atk: 11, spd: 210, bspd: 310, atkCD: 0.78,
    dashCD: 0, dashMaxCD: 3, dashActive: false, dashT: 0,
    dashDur: 0.22, dashDist: 210, dvx: 0, dvy: 0,
    atkT: 0, invT: 0,
    lv: 1, exp: 0, expNext: 12, expM: 1,
    shots: 1, lifesteal: 0, pierce: false, explode: false,
    shadowDash: false, deathBurst: false, berserk: false, lightning: false,
    orbs: 0, orbAngle: 0,
    aura: false, auraT: 0,
    regen: false, regenT: 5,
    shieldCD: 0, shieldT: 0, shielded: false,
    freezeCD: 0, freezeT: 0,
    kills: 0, cards: [],
  };
}

// 列表
let bullets = [], enemies = [], xporbs = [], particles = [], floattexts = [], burns = [];
let waveTimer = 0, waveInterval = 3, waveNum = 0, eliteTimer = 90, bossSpawned = false;

// 升级
let lvCards = [], lvHover = -1, endRect = null;

function startGame() {
  resetPlayer();
  bullets=[]; enemies=[]; xporbs=[]; particles=[]; floattexts=[]; burns=[];
  waveTimer=0; waveInterval=3; waveNum=0; eliteTimer=90; bossSpawned=false;
  gtime=0; frame=0; shakeT=0; flashT=0;
  lvCards=[]; lvHover=-1; endRect=null;
  gs='playing';
}

// ── 战斗逻辑 ─────────────────────────────────────────────
function addParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rnd(50, 150);
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: rnd(1.5,3.5), color, life: rnd(0.4,0.7), ml: 0.7 });
  }
}
function addFloat(x, y, text, color) {
  floattexts.push({ x, y, text, color, life: 1.2, vy: -34 });
}

function hitEnemy(e, dmg) {
  if (e.frozenT > 0) dmg *= 1.3;
  e.hp -= dmg;
  addFloat(e.x, e.y - e.r - 4, Math.round(dmg) + '', '#fff');
  addParticles(e.x, e.y, e.color, 3);
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  addParticles(e.x, e.y, e.color, 14);
  shakeT = 0.1;
  P.kills++;
  P.hp = Math.min(P.mhp, P.hp + P.lifesteal);
  const xpv = (e.boss ? 30 : e.elite ? 8 : 1) * P.expM;
  xporbs.push({ x: e.x, y: e.y, v: xpv, r: 5, life: 15, delay: 0.25 });
  if (P.deathBurst) {
    enemies.forEach(o => { if (o !== e && dist2(o.x,o.y,e.x,e.y) < 85) hitEnemy(o, P.atk * 1.5); });
    addParticles(e.x, e.y, '#f80', 18);
  }
  if (P.lightning && Math.random() < 0.3) {
    let last = e, chain = 3;
    while (chain--) {
      let nr = null, nd = Infinity;
      enemies.forEach(o => { if (o !== last && o.hp > 0) { const d = dist2(o.x,o.y,last.x,last.y); if (d < nd) { nd=d; nr=o; } } });
      if (nr && nd < 180) hitEnemy(nr, P.atk * 2);
    }
  }
  e.hp = -1;
}

function doSkill() {
  if (P.dashCD > 0) return;
  let dx = 0, dy = 0;
  if (KEY.KeyA || KEY.ArrowLeft)  dx = -1;
  if (KEY.KeyD || KEY.ArrowRight) dx =  1;
  if (KEY.KeyW || KEY.ArrowUp)    dy = -1;
  if (KEY.KeyS || KEY.ArrowDown)  dy =  1;
  if (!dx && !dy) dy = -1;
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  P.dashActive = true;
  P.dashT = P.dashDur;
  P.dvx = dx * P.dashDist / P.dashDur;
  P.dvy = dy * P.dashDist / P.dashDur;
  P.dashCD = P.dashMaxCD;
  if (P.shadowDash) burns.push({ x:P.x, y:P.y, r:50, life:2, ml:2, dmg:P.atk*0.5, color:'rgba(64,170,255,0.3)' });
}

function shoot() {
  if (!enemies.length) return;
  let nr = null, nd = Infinity;
  enemies.forEach(e => { const d = dist2(P.x,P.y,e.x,e.y); if (d < nd) { nd=d; nr=e; } });
  if (!nr || nd > 300) return;
  const base = Math.atan2(nr.y - P.y, nr.x - P.x);
  const n = P.shots;
  const atk = P.atk * (P.berserk ? Math.max(1, 1 + 0.5*(1 - P.hp/P.mhp)) : 1);
  for (let i = 0; i < n; i++) {
    const sp = n > 1 ? (i/(n-1) - 0.5) * 0.45 : 0;
    const a = base + sp;
    bullets.push({ x:P.x, y:P.y, vx:Math.cos(a)*P.bspd, vy:Math.sin(a)*P.bspd, dmg:atk, r:5, life:1.6, pierce:P.pierce, explode:P.explode });
  }
}

function gainExp(v) {
  P.exp += v;
  if (P.exp >= P.expNext) {
    P.exp -= P.expNext;
    P.lv++;
    P.expNext = Math.floor(P.expNext * 1.42);
    flashT = 0.3;
    lvCards = pickCards(3);
    gs = 'levelup';
  }
}

function spawnEnemy(elite) {
  const side = Math.floor(Math.random()*4);
  let x, y;
  if      (side===0) { x=rnd(0,GW); y=-20; }
  else if (side===1) { x=GW+20;     y=rnd(0,GH); }
  else if (side===2) { x=rnd(0,GW); y=GH+20; }
  else               { x=-20;        y=rnd(0,GH); }
  const hp = elite ? 65 + waveNum*10 : 8 + waveNum*2;
  enemies.push({ x, y, r: elite ? 18 : rnd(9,14), hp, mhp: hp,
    spd: elite ? 62 : rnd(82,138), dmg: elite ? 14 : 8,
    color: elite ? '#ff4' : '#f55', elite, boss:false, frozenT:0, aoeT: elite ? 3 : 0 });
}

function spawnBoss() {
  enemies.push({ x:GW/2, y:-30, r:26, hp:550, mhp:550, spd:68, dmg:20,
    color:'#f44', elite:false, boss:true, frozenT:0, aoeT:5, phase:1 });
}

// ── 主更新 ───────────────────────────────────────────────
function update(dt) {
  if (gs !== 'playing') return;
  frame++; gtime += dt;
  if (gtime >= GDUR) { gs = 'win'; return; }
  if (P.hp   <= 0)   { gs = 'gameover'; return; }
  if (gtime >= 240 && !bossSpawned) { bossSpawned=true; spawnBoss(); addFloat(GW/2, GH/3, '⚠ BOSS降临！', '#f44'); }

  shakeT = Math.max(0, shakeT - dt);
  flashT = Math.max(0, flashT - dt);
  if (P.invT  > 0) P.invT  -= dt;
  if (P.dashCD > 0) P.dashCD -= dt;

  // 护盾
  if (P.shieldCD > 0) { P.shieldT -= dt; if (P.shieldT <= 0) { P.shielded=true; P.shieldT=P.shieldCD; addFloat(P.x, P.y-25, '护盾！', '#4af'); } }
  // 冰冻
  if (P.freezeCD > 0) { P.freezeT -= dt; if (P.freezeT <= 0) { P.freezeT=P.freezeCD; enemies.forEach(e=>{e.frozenT=3;}); addFloat(P.x,P.y-25,'❄冰冻！','#aef'); addParticles(P.x,P.y,'#aef',22); } }
  // 回血
  if (P.regen) { P.regenT -= dt; if (P.regenT <= 0) { P.regenT=5; P.hp=Math.min(P.mhp,P.hp+5); } }
  // 光环
  if (P.aura) { P.auraT -= dt; if (P.auraT <= 0) { P.auraT=1.5; enemies.forEach(e=>{ if(dist2(P.x,P.y,e.x,e.y)<100) hitEnemy(e,P.atk*0.8); }); addParticles(P.x,P.y,'#4af',7); } }

  // 技能
  if (spacePushed) { spacePushed=false; doSkill(); }

  // 冲刺
  if (P.dashActive) {
    P.dashT -= dt;
    P.x += P.dvx * dt; P.y += P.dvy * dt;
    P.x = clamp(P.x, P.r, GW-P.r); P.y = clamp(P.y, P.r, GH-P.r);
    enemies.forEach(e => { if (dist2(P.x,P.y,e.x,e.y) < P.r+e.r+8) hitEnemy(e, P.atk*2); });
    if (P.dashT <= 0) P.dashActive = false;
  }

  // 移动
  if (!P.dashActive) {
    let mx=0, my=0;
    if (KEY.KeyA||KEY.ArrowLeft)  mx -= 1;
    if (KEY.KeyD||KEY.ArrowRight) mx += 1;
    if (KEY.KeyW||KEY.ArrowUp)    my -= 1;
    if (KEY.KeyS||KEY.ArrowDown)  my += 1;
    const ml = Math.hypot(mx, my);
    if (ml > 0) { P.x += mx/ml*P.spd*dt; P.y += my/ml*P.spd*dt; }
  }
  P.x = clamp(P.x, P.r, GW-P.r); P.y = clamp(P.y, P.r, GH-P.r);

  // 自动攻击
  P.atkT -= dt; if (P.atkT <= 0) { shoot(); P.atkT = P.atkCD; }

  // 轨道球
  if (P.orbs > 0) {
    P.orbAngle += dt * 2.2;
    for (let i=0; i<P.orbs; i++) {
      const a = P.orbAngle + i * TAU/P.orbs;
      const ox = P.x + Math.cos(a)*52, oy = P.y + Math.sin(a)*52;
      enemies.forEach(e => { if (dist2(ox,oy,e.x,e.y) < 20) hitEnemy(e, P.atk*dt*3); });
    }
  }

  // 生成敌人
  waveTimer -= dt;
  if (waveTimer <= 0) {
    waveNum++;
    const cnt = 2 + Math.floor(waveNum * 0.55);
    eliteTimer -= waveInterval;
    if (eliteTimer <= 0) { spawnEnemy(true); eliteTimer = 90; }
    for (let i=0; i<cnt; i++) spawnEnemy(false);
    waveInterval = Math.max(1.1, 3 - waveNum*0.09);
    waveTimer = waveInterval;
  }

  // 子弹
  bullets = bullets.filter(b => {
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.life<=0 || b.x<-30 || b.x>GW+30 || b.y<-30 || b.y>GH+30) return false;
    let hit = false;
    enemies.forEach(e => {
      if (e.hp<=0) return;
      if (dist2(b.x,b.y,e.x,e.y) < b.r+e.r) {
        hitEnemy(e, b.dmg);
        if (b.explode) { addParticles(b.x,b.y,'#f80',8); enemies.forEach(e2=>{ if(e2!==e && dist2(e2.x,e2.y,b.x,b.y)<55) hitEnemy(e2,b.dmg*0.5); }); }
        if (!b.pierce) hit = true;
      }
    });
    return !hit;
  });

  // 敌人
  enemies = enemies.filter(e => {
    if (e.hp <= 0) return false;
    if (e.frozenT > 0) { e.frozenT -= dt; return true; }
    const dx=P.x-e.x, dy=P.y-e.y, dl=Math.hypot(dx,dy)||1;
    e.x += dx/dl*e.spd*dt; e.y += dy/dl*e.spd*dt;
    if (e.boss) {
      if      (e.hp < e.mhp*0.3 && e.phase<3) { e.phase=3; e.spd*=1.35; e.color='#f0f'; }
      else if (e.hp < e.mhp*0.6 && e.phase<2) { e.phase=2; e.spd*=1.18; e.color='#f84'; }
    }
    if (e.elite||e.boss) { e.aoeT-=dt; if(e.aoeT<=0){e.aoeT=e.boss?3:5; addParticles(e.x,e.y,e.color,12);} }
    if (dist2(P.x,P.y,e.x,e.y) < P.r+e.r) {
      if (P.invT<=0 && !P.shielded) P.hp -= e.dmg*dt;
      else if (P.shielded) { P.shielded=false; addFloat(P.x,P.y-25,'护盾！','#4af'); }
    }
    return true;
  });

  // 经验球
  xporbs = xporbs.filter(o => {
    o.life -= dt; o.delay -= dt;
    if (o.delay < 0) {
      const dx=P.x-o.x, dy=P.y-o.y, dl=Math.hypot(dx,dy)||1;
      o.x += dx/dl*280*dt; o.y += dy/dl*280*dt;
    }
    if (dist2(P.x,P.y,o.x,o.y) < P.r+o.r+4) { gainExp(o.v); return false; }
    return o.life > 0;
  });

  // 燃烧区
  burns = burns.filter(b => {
    b.life -= dt;
    enemies.forEach(e => { if (dist2(e.x,e.y,b.x,b.y)<b.r) hitEnemy(e,b.dmg*dt); });
    return b.life > 0;
  });

  // 粒子 & 浮字
  particles  = particles.filter(p  => { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.88; p.vy*=0.88; p.life-=dt; return p.life>0; });
  floattexts = floattexts.filter(f => { f.y+=f.vy*dt; f.life-=dt; return f.life>0; });
}

// ── 绘制 ─────────────────────────────────────────────────
function drawFrame() {
  const sx = shakeT>0 ? (Math.random()-0.5)*5 : 0;
  const sy = shakeT>0 ? (Math.random()-0.5)*5 : 0;
  g.save(); g.translate(sx, sy);

  // 背景
  g.fillStyle = '#07071a'; g.fillRect(0,0,GW,GH);
  STARS.forEach(s => { g.globalAlpha=s.a; g.fillStyle='#fff'; g.beginPath(); g.arc(s.x,s.y,s.r,0,TAU); g.fill(); });
  g.globalAlpha = 1;

  if (gs === 'playing' || gs === 'levelup') {
    // 燃烧区
    burns.forEach(b => { g.globalAlpha=b.life/b.ml*0.3; g.fillStyle=b.color; g.beginPath(); g.arc(b.x,b.y,b.r,0,TAU); g.fill(); });
    g.globalAlpha = 1;

    // 经验球
    xporbs.forEach(o => {
      g.save(); g.shadowColor='#0f0'; g.shadowBlur=8;
      g.fillStyle='#4f4'; g.beginPath(); g.arc(o.x,o.y,o.r*(0.88+Math.sin(frame*0.25)*0.12),0,TAU); g.fill();
      g.restore();
    });

    // 粒子
    particles.forEach(p => { g.globalAlpha=p.life/p.ml; g.fillStyle=p.color; g.beginPath(); g.arc(p.x,p.y,p.r,0,TAU); g.fill(); });
    g.globalAlpha = 1;

    // 子弹
    bullets.forEach(b => {
      g.save(); g.shadowColor='#7cf'; g.shadowBlur=10;
      g.fillStyle='#7cf'; g.beginPath(); g.arc(b.x,b.y,b.r,0,TAU); g.fill();
      g.restore();
    });

    // 敌人
    enemies.forEach(e => {
      if (e.hp <= 0) return;
      const col = e.frozenT>0 ? '#aef' : e.color;
      g.save(); g.shadowColor=col; g.shadowBlur=8;
      if (e.boss) {
        g.translate(e.x,e.y); g.rotate(frame*0.02); g.fillStyle=col; g.beginPath();
        for (let i=0;i<6;i++){const a=i*Math.PI/3;g.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r);}
        g.closePath(); g.fill();
      } else if (e.elite) {
        g.translate(e.x,e.y); g.rotate(frame*0.04); g.fillStyle=col; g.beginPath();
        for (let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4;g.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r);}
        g.closePath(); g.fill();
      } else {
        g.fillStyle=col; g.beginPath();
        g.moveTo(e.x, e.y-e.r); g.lineTo(e.x+e.r*0.85, e.y+e.r*0.6); g.lineTo(e.x-e.r*0.85, e.y+e.r*0.6);
        g.closePath(); g.fill();
      }
      g.restore();
      if (e.hp < e.mhp) {
        const bw=e.r*2.4, bx=e.x-bw/2, by=e.y-e.r-9;
        g.fillStyle='#333'; g.fillRect(bx,by,bw,4);
        g.fillStyle=e.boss?'#f44':'#4f4'; g.fillRect(bx,by,bw*(e.hp/e.mhp),4);
      }
    });

    // 轨道球
    for (let i=0; i<P.orbs; i++) {
      const a = P.orbAngle + i*TAU/P.orbs;
      g.save(); g.shadowColor='#ff0'; g.shadowBlur=12;
      g.fillStyle='#ff0'; g.beginPath(); g.arc(P.x+Math.cos(a)*52, P.y+Math.sin(a)*52, 8, 0, TAU); g.fill();
      g.restore();
    }

    // 玩家（蓝色光球+剑）
    if (P.shielded) {
      g.save(); g.shadowColor='#4af'; g.shadowBlur=18;
      g.strokeStyle='#4af'; g.lineWidth=3; g.beginPath(); g.arc(P.x,P.y,P.r+9,0,TAU); g.stroke();
      g.restore();
    }
    const pg = g.createRadialGradient(P.x,P.y,P.r*0.3,P.x,P.y,P.r*1.8);
    pg.addColorStop(0,'rgba(64,170,255,0.7)'); pg.addColorStop(1,'transparent');
    g.fillStyle=pg; g.beginPath(); g.arc(P.x,P.y,P.r*1.8,0,TAU); g.fill();
    g.save(); g.shadowColor='#4af'; g.shadowBlur=16;
    g.fillStyle='#4af'; g.beginPath(); g.arc(P.x,P.y,P.r,0,TAU); g.fill();
    g.restore();
    g.save(); g.translate(P.x,P.y); g.rotate(frame*0.05);
    g.strokeStyle='#fff'; g.lineWidth=2.5;
    g.beginPath(); g.moveTo(0,-P.r*1.5); g.lineTo(0,P.r*1.5); g.stroke();
    g.beginPath(); g.moveTo(-P.r*0.6,-P.r*0.3); g.lineTo(P.r*0.6,-P.r*0.3); g.stroke();
    g.restore();

    // 浮字
    floattexts.forEach(f => {
      g.save(); g.globalAlpha=f.life/1.2; g.fillStyle=f.color;
      g.font='bold 13px Microsoft YaHei,sans-serif'; g.textAlign='center';
      g.fillText(f.text, f.x, f.y); g.restore();
    });

    // 升级闪光
    if (flashT > 0) { g.globalAlpha=flashT/0.3*0.35; g.fillStyle='#fff'; g.fillRect(0,0,GW,GH); g.globalAlpha=1; }
  }

  g.restore(); // 震屏结束

  // ── HUD（不受震屏影响）──
  if (gs==='playing') drawHUD();
  else if (gs==='levelup') drawLevelUp();
  else if (gs==='win'||gs==='gameover') drawEnd();

  // 技能按钮
  if (gs==='playing') {
    skillDiv.style.display='flex';
    if (P.dashCD>0) { skillDiv.style.borderColor='#444'; skillDiv.style.color='#555'; skillDiv.innerHTML=P.dashCD.toFixed(1)+'s'; }
    else { skillDiv.style.borderColor='rgba(255,200,50,0.7)'; skillDiv.style.color='#ffc832'; skillDiv.innerHTML='冲刺<br>SPACE'; }
  } else { skillDiv.style.display='none'; }
}

function drawHUD() {
  g.fillStyle='rgba(0,0,20,0.7)'; g.fillRect(0,0,GW,44);
  // HP
  g.fillStyle='#1a1a1a'; g.fillRect(14,13,195,15);
  const hr = P.hp/P.mhp;
  g.fillStyle = hr>0.5?'#3c3':hr>0.25?'#f90':'#e22'; g.fillRect(14,13,195*hr,15);
  g.strokeStyle='#333'; g.lineWidth=1; g.strokeRect(14,13,195,15);
  g.fillStyle='#fff'; g.font='bold 11px Microsoft YaHei,sans-serif'; g.textAlign='left';
  g.fillText('❤ '+Math.ceil(P.hp)+' / '+Math.ceil(P.mhp), 18, 24);
  // 经验
  g.fillStyle='#111'; g.fillRect(GW/2-105,29,210,10);
  g.fillStyle='#36f'; g.fillRect(GW/2-105,29,210*(P.exp/P.expNext),10);
  g.strokeStyle='#224'; g.strokeRect(GW/2-105,29,210,10);
  g.fillStyle='#adf'; g.font='10px Microsoft YaHei,sans-serif'; g.textAlign='center';
  g.fillText('Lv.'+P.lv+'  '+Math.floor(P.exp)+'/'+Math.floor(P.expNext), GW/2, 38);
  // 倒计时
  const rem=Math.max(0,GDUR-gtime), mm=Math.floor(rem/60), ss=Math.floor(rem%60);
  g.fillStyle=rem<30?'#f44':'#fff'; g.font='bold 22px Microsoft YaHei,sans-serif'; g.textAlign='right';
  g.fillText(String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0'), GW-14, 32);
  g.fillStyle='#fa0'; g.font='12px Microsoft YaHei,sans-serif';
  g.fillText('击杀: '+P.kills, GW-14, 44);
  // 已选卡图标
  P.cards.slice(-7).forEach((cd,i) => {
    const cx=14+i*34, cy=GH-44;
    g.fillStyle=RC[cd.r]+'22'; g.fillRect(cx,cy,28,28);
    g.strokeStyle=RC[cd.r]; g.lineWidth=1.5; g.strokeRect(cx,cy,28,28);
    g.font='15px sans-serif'; g.textAlign='center'; g.fillText(cd.i, cx+14, cy+20);
  });
  // 技能CD圆
  const cx=GW/2, cy=GH-42, cr=19;
  g.fillStyle='rgba(0,0,0,0.55)'; g.beginPath(); g.arc(cx,cy,cr,0,TAU); g.fill();
  g.strokeStyle='#4af'; g.lineWidth=3; g.beginPath(); g.arc(cx,cy,cr,0,TAU); g.stroke();
  if (P.dashCD>0) {
    const ratio=P.dashCD/P.dashMaxCD;
    g.fillStyle='rgba(0,0,0,0.5)'; g.beginPath(); g.moveTo(cx,cy);
    g.arc(cx,cy,cr,-Math.PI/2,-Math.PI/2+ratio*TAU); g.closePath(); g.fill();
    g.fillStyle='#888'; g.font='9px Microsoft YaHei,sans-serif'; g.textAlign='center';
    g.fillText(P.dashCD.toFixed(1), cx, cy+4);
  } else {
    g.fillStyle='#fff'; g.font='bold 9px Microsoft YaHei,sans-serif'; g.textAlign='center';
    g.fillText('冲刺', cx, cy+4);
  }
}

function drawLevelUp() {
  g.fillStyle='rgba(0,0,18,0.85)'; g.fillRect(0,0,GW,GH);
  g.fillStyle='#ffd700'; g.font='bold 26px Microsoft YaHei,sans-serif'; g.textAlign='center';
  g.fillText('✨ 升至 Lv.'+P.lv+' · 选择增益', GW/2, GH/2-148);
  g.fillStyle='#777'; g.font='13px Microsoft YaHei,sans-serif';
  g.fillText('点击卡牌选择一项', GW/2, GH/2-120);

  const cw=178, ch=242, gap=20, n=lvCards.length;
  const tw=n*(cw+gap)-gap, sx=GW/2-tw/2, sy=GH/2-96;

  lvCards.forEach((cd, i) => {
    const cx=sx+i*(cw+gap), cy=sy, hov=lvHover===i;
    const grad=g.createLinearGradient(cx,cy,cx,cy+ch);
    grad.addColorStop(0, hov?'#1c1c3e':'#0d0d1e');
    grad.addColorStop(1, hov?'#281840':'#131328');
    g.fillStyle=grad; rrect(cx,cy,cw,ch,12); g.fill();
    if (hov) { g.shadowColor=RC[cd.r]; g.shadowBlur=18; }
    g.strokeStyle=RC[cd.r]+(hov?'ff':'77'); g.lineWidth=hov?2.5:1.8;
    rrect(cx,cy,cw,ch,12); g.stroke(); g.shadowBlur=0;
    // 稀有度标
    g.fillStyle=RC[cd.r]+'33'; g.fillRect(cx+8,cy+8,cw-16,20);
    g.fillStyle=RC[cd.r]; g.font='bold 11px Microsoft YaHei,sans-serif'; g.textAlign='center';
    g.fillText(RL[cd.r], cx+cw/2, cy+21);
    // 图标
    g.font='44px sans-serif'; g.fillText(cd.i, cx+cw/2, cy+80);
    // 名字
    g.fillStyle='#fff'; g.font='bold 16px Microsoft YaHei,sans-serif'; g.fillText(cd.n, cx+cw/2, cy+110);
    // 分割线
    g.strokeStyle='#2a2a44'; g.lineWidth=1;
    g.beginPath(); g.moveTo(cx+14,cy+120); g.lineTo(cx+cw-14,cy+120); g.stroke();
    // 描述（换行）
    g.fillStyle='#bbb'; g.font='12px Microsoft YaHei,sans-serif'; g.textAlign='center';
    wrapText(cd.d, cx+cw/2, cy+140, cw-18, 17);
  });
}

function wrapText(text, x, y, maxW, lineH) {
  const chars = [...text]; let line = '';
  chars.forEach(ch => {
    const t = line+ch;
    if (g.measureText(t).width > maxW) { g.fillText(line,x,y); line=ch; y+=lineH; }
    else line=t;
  });
  if (line) g.fillText(line, x, y);
}

function drawEnd() {
  g.fillStyle='rgba(0,0,14,0.92)'; g.fillRect(0,0,GW,GH);
  const win=gs==='win';
  g.fillStyle=win?'#ffd700':'#f44'; g.font='bold 44px Microsoft YaHei,sans-serif'; g.textAlign='center';
  g.fillText(win?'🏆 大吉大利！混沌夺宝！':'💀 英雄倒下了', GW/2, GH/2-130);
  const sec=Math.floor(gtime), mm=Math.floor(sec/60), ss=sec%60;
  g.fillStyle='#aaa'; g.font='16px Microsoft YaHei,sans-serif';
  g.fillText('存活 '+mm+'分'+ss+'秒  ·  击杀 '+P.kills+'  ·  Lv.'+P.lv, GW/2, GH/2-90);
  if (P.cards.length) {
    g.fillStyle='#ddd'; g.font='bold 14px Microsoft YaHei,sans-serif'; g.fillText('本局卡牌：', GW/2, GH/2-58);
    const cols=4, cw=GW/cols;
    P.cards.forEach((cd,i) => {
      g.fillStyle=RC[cd.r]; g.font='13px Microsoft YaHei,sans-serif'; g.textAlign='center';
      g.fillText(cd.i+' '+cd.n, cw/2+(i%cols)*cw, GH/2-34+Math.floor(i/cols)*24);
    });
  }
  const rows=Math.ceil(Math.max(1,P.cards.length)/4);
  const bx=GW/2-95, by=GH/2+rows*24+4, bw=190, bh=48;
  const bg=g.createLinearGradient(bx,by,bx,by+bh);
  bg.addColorStop(0,'#3366ff'); bg.addColorStop(1,'#1133cc');
  g.fillStyle=bg; rrect(bx,by,bw,bh,10); g.fill();
  g.strokeStyle='#66aaff'; g.lineWidth=2; rrect(bx,by,bw,bh,10); g.stroke();
  g.fillStyle='#fff'; g.font='bold 20px Microsoft YaHei,sans-serif'; g.textAlign='center';
  g.fillText('🔄 再来一局', GW/2, by+32);
  endRect = { x:bx, y:by, w:bw, h:bh };
}

// ── 点击处理 ─────────────────────────────────────────────
c.addEventListener('click', e => {
  c.focus();
  const mx = e.offsetX / (c.clientWidth  / GW);
  const my = e.offsetY / (c.clientHeight / GH);
  if (gs==='levelup') {
    const cw=178,ch=242,gap=20,n=lvCards.length,tw=n*(cw+gap)-gap,sx=GW/2-tw/2,sy=GH/2-96;
    lvCards.forEach((cd,i)=>{ const cx=sx+i*(cw+gap); if(mx>=cx&&mx<=cx+cw&&my>=sy&&my<=sy+ch){cd.fn(P);P.cards.push(cd);gs='playing';} });
  }
  if ((gs==='win'||gs==='gameover') && endRect) {
    const b=endRect; if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h) startGame();
  }
});
c.addEventListener('mousemove', e => {
  const mx=e.offsetX/(c.clientWidth/GW), my=e.offsetY/(c.clientHeight/GH);
  if (gs==='levelup') {
    const cw=178,ch=242,gap=20,n=lvCards.length,tw=n*(cw+gap)-gap,sx=GW/2-tw/2,sy=GH/2-96;
    lvHover=-1;
    lvCards.forEach((cd,i)=>{ const cx=sx+i*(cw+gap); if(mx>=cx&&mx<=cx+cw&&my>=sy&&my<=sy+ch) lvHover=i; });
  }
});
c.addEventListener('touchend', e => {
  e.preventDefault();
  const rect=c.getBoundingClientRect();
  const t=e.changedTouches[0];
  const mx=(t.clientX-rect.left)/(rect.width/GW), my=(t.clientY-rect.top)/(rect.height/GH);
  if (gs==='levelup') {
    const cw=178,ch=242,gap=20,n=lvCards.length,tw=n*(cw+gap)-gap,sx=GW/2-tw/2,sy=GH/2-96;
    lvCards.forEach((cd,i)=>{ const cx=sx+i*(cw+gap); if(mx>=cx&&mx<=cx+cw&&my>=sy&&my<=sy+ch){cd.fn(P);P.cards.push(cd);gs='playing';} });
  }
  if ((gs==='win'||gs==='gameover') && endRect) {
    const b=endRect; if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h) startGame();
  }
},{passive:false});

// ── 主循环 ───────────────────────────────────────────────
startGame();

let lastTS = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTS) / 1000, 0.05);
  lastTS = ts;
  update(dt);
  drawFrame();
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts => { lastTS = ts; requestAnimationFrame(loop); });
</script>
