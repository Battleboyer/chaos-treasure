<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>混沌夺宝 · 王者生存</title>
<!-- 引入字体 & 粒子库 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; overflow: hidden;
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    border: 1px solid #1a1a3a;
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(68, 136, 255, 0.15), 0 0 120px rgba(68, 136, 255, 0.05);
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ===================== 基础设置 =====================
const W = 1000, H = 680;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

let state = 'menu';
let shakeTimer = 0, shakeX = 0, shakeY = 0, flashTimer = 0;
let frameCount = 0;
let bgStars = [];

// 预生成背景星星
for (let i = 0; i < 120; i++) {
  bgStars.push({ x: Math.random() * W, y: Math.random() * H, r: 0.5 + Math.random() * 1.5, a: 0.2 + Math.random() * 0.5, s: 0.5 + Math.random() * 1.5 });
}

// ===================== 输入 =====================
const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ===================== 游戏状态 =====================
let player, bullets, enemies, expOrbs, particles, floatingTexts;
let spawnTimer, spawnInterval, spawnCount;
let gameTime, maxTime;
let killCount, eliteTimer, bossSpawned;
let selectedCards, cardHistory;
let difficulty = 1;

// ===================== 卡牌系统 =====================
// 通用卡（任何英雄都能选）
const GENERIC_CARDS = [
  // 攻击系
  { id: 'atk1',   name: '剑意凝聚',   desc: '攻击力 +20%',         tier: 'common', color: '#ff6b35', icon: '⚔️', apply: p => { p.atkMult *= 1.2; } },
  { id: 'atk2',   name: '破军之势',   desc: '攻击力 +40%，移速 -8%', tier: 'rare',   color: '#e74c3c', icon: '💥', apply: p => { p.atkMult *= 1.4; p.speedMult *= 0.92; } },
  { id: 'atks1',  name: '疾风骤雨',   desc: '攻速 +35%',            tier: 'common', color: '#4ecdc4', icon: '🌀', apply: p => { p.atkSpeedMult *= 0.65; } },
  { id: 'atks2',  name: '狂热',       desc: '攻速 +80%，攻击力 -15%', tier: 'rare',   color: '#f39c12', icon: '🔥', apply: p => { p.atkSpeedMult *= 0.2; p.atkMult *= 0.85; } },
  // 防御系
  { id: 'hp1',    name: '铁甲淬炼',   desc: '最大血量 +40，回复40',  tier: 'common', color: '#95e1d3', icon: '🛡️', apply: p => { p.maxHp += 40; p.hp = Math.min(p.hp + 40, p.maxHp); } },
  { id: 'hp2',    name: '不灭之体',   desc: '最大血量 +80，回复80',  tier: 'rare',   color: '#2ecc71', icon: '💚', apply: p => { p.maxHp += 80; p.hp = Math.min(p.hp + 80, p.maxHp); } },
  { id: 'hp3',    name: '浴血再生',   desc: '每3秒回复 3% 血量',     tier: 'epic',   color: '#27ae60', icon: '🌿', apply: p => { p.regen = (p.regen || 0) + 0.03; } },
  { id: 'armor1', name: '坚韧意志',   desc: '受到伤害 -20%',         tier: 'common', color: '#3498db', icon: '⛑️', apply: p => { p.armor = (p.armor || 0) + 0.2; } },
  { id: 'armor2', name: '金刚不坏',   desc: '受到伤害 -40%',         tier: 'epic',   color: '#2980b9', icon: '🧱', apply: p => { p.armor = (p.armor || 0) + 0.4; } },
  // 移动系
  { id: 'spd1',   name: '疾风步法',   desc: '移速 +20%',            tier: 'common', color: '#1abc9c', icon: '💨', apply: p => { p.speedMult *= 1.2; } },
  { id: 'spd2',   name: '幻影身法',   desc: '移速 +40%',            tier: 'rare',   color: '#16a085', icon: '👻', apply: p => { p.speedMult *= 1.4; } },
  // 特殊系
  { id: 'multi',  name: '弹幕化',     desc: '攻击变为3发散射',       tier: 'epic',   color: '#9b59b6', icon: '🌀', apply: p => { p.multiShot = true; } },
  { id: 'lifesteal',name: '嗜血',    desc: '击杀回复 4 血',         tier: 'rare',   color: '#e74c3c', icon: '🩸', apply: p => { p.lifesteal = (p.lifesteal || 0) + 4; } },
  { id: 'clone',  name: '残影分身',   desc: '冲刺留下伤害残影',      tier: 'epic',   color: '#3498db', icon: '👥', apply: p => { p.cloneOnDash = true; } },
  { id: 'big',    name: '破军之力',   desc: '子弹 +100%，伤害 +25%', tier: 'rare',   color: '#e67e22', icon: '💎', apply: p => { p.bigBullet = true; p.atkMult *= 1.25; } },
  { id: 'orbit',  name: '星轨护体',   desc: '2颗轨道球环绕，碰触伤害', tier: 'epic',  color: '#f1c40f', icon: '🌍', apply: p => { p.orbitCount = (p.orbitCount || 0) + 2; } },
  { id: 'thorns', name: '荆棘反甲',   desc: '受到近战伤害反弹 40%',  tier: 'rare',   color: '#8e44ad', icon: '🌵', apply: p => { p.thorns = (p.thorns || 0) + 0.4; } },
  { id: 'explode',name: '死亡爆破',   desc: '击杀敌人引发爆炸',      tier: 'epic',   color: '#c0392b', icon: '💣', apply: p => { p.explode = true; } },
  { id: 'freeze', name: '寒冰领域',   desc: '每10秒冰冻全场 1.5秒', tier: 'legendary', color: '#00bfff', icon: '❄️', apply: p => { p.freeze = true; } },
  { id: 'lightning',name: '雷神之怒', desc: '每8秒召唤闪电链',      tier: 'legendary', color: '#f1c40f', icon: '⚡', apply: p => { p.lightning = true; } },
  { id: 'heal',   name: '治愈之心',   desc: '每秒回复 2 点血量',     tier: 'common', color: '#2ecc71', icon: '💚', apply: p => { p.healPerSec = (p.healPerSec || 0) + 2; } },
];

// 英雄专属卡（只会在对应英雄出现）
const HERO_SPECIFIC = {
  'libai': [
    { id: 'lb1', name: '青莲剑诀', desc: '冲刺伤害翻倍，范围+50%', tier: 'epic', color: '#8e44ad', icon: '🗡️', apply: p => { p.dashDmgMult = (p.dashDmgMult || 1) * 2; p.dashRangeMult = 1.5; } },
    { id: 'lb2', name: '剑心通明', desc: '自动攻击每次叠加2%攻速，最多40%', tier: 'rare', color: '#3498db', icon: '⚡', apply: p => { p.stackingAtkSpd = true; } },
    { id: 'lb3', name: '十步一杀', desc: '每击杀10只怪，下一次冲刺伤害+500%', tier: 'legendary', color: '#e74c3c', icon: '💀', apply: p => { p.tenStepKill = true; } },
  ],
  'daji': [
    { id: 'dj1', name: '星辉漫舞', desc: '弹幕散射+1颗，共4颗', tier: 'epic', color: '#9b59b6', icon: '✨', apply: p => { p.multiShot = true; p.multiExtra = (p.multiExtra || 0) + 1; } },
    { id: 'dj2', name: '魅惑之种', desc: '命中敌人有15%概率眩晕1秒', tier: 'rare', color: '#e91e63', icon: '💕', apply: p => { p.charm = true; } },
    { id: 'dj3', name: '星之引力', desc: '经验球吸引范围翻倍', tier: 'common', color: '#f7dc6f', icon: '🧲', apply: p => { p.expRangeMult = 2; } },
  ],
  'chengyaojin': [
    { id: 'cy1', name: '不灭战意', desc: '血量低于30%时攻速+100%', tier: 'epic', color: '#e74c3c', icon: '❤️‍🔥', apply: p => { p.berserk = true; } },
    { id: 'cy2', name: '血怒', desc: '每次受伤增加5%攻击力，持续3秒', tier: 'rare', color: '#c0392b', icon: '😤', apply: p => { p.rage = true; } },
    { id: 'cy3', name: '铜墙铁壁', desc: '血量每损失10%，减伤+3%', tier: 'legendary', color: '#2c3e50', icon: '🏰', apply: p => { p.ironWall = true; } },
  ],
};

function getRandomCards(hero) {
  let pool = [...GENERIC_CARDS];
  // 当前已选卡牌ID集合，避免重复
  const selectedIds = new Set(selectedCards.map(c => c.id));
  // 英雄专属卡
  if (hero && HERO_SPECIFIC[hero]) {
    pool = pool.concat(HERO_SPECIFIC[hero]);
  }
  // 过滤已选
  pool = pool.filter(c => !selectedIds.has(c.id));
  // 随机洗牌
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  // 返回3张，如果不够就重复允许（不会出现不够的情况）
  let result = [];
  if (pool.length >= 3) {
    result = pool.slice(0, 3);
  } else {
    result = pool;
    // 不够3张时从全部卡里补（允许重复）
    const all = GENERIC_CARDS.concat(hero && HERO_SPECIFIC[hero] ? HERO_SPECIFIC[hero] : []);
    while (result.length < 3) {
      result.push(all[Math.floor(Math.random() * all.length)]);
    }
  }
  return result;
}

// ===================== 初始化 =====================
function initGame() {
  const heroIdx = _selectedHero !== undefined ? _selectedHero : 0;
  const heroList = ['libai', 'daji', 'chengyaojin'];
  const hero = heroList[heroIdx] || 'libai';

  player = {
    x: W / 2, y: H / 2,
    r: 18, speed: 220,
    hp: 100, maxHp: 100,
    atk: 12, atkSpeed: 0.75, atkTimer: 0,
    exp: 0, expNext: 12, level: 0,
    dashCD: 0, dashCooldown: 3,
    atkSpeedMult: 1, speedMult: 1, atkMult: 1,
    multiShot: false, multiExtra: 0,
    lifesteal: 0, cloneOnDash: false,
    bigBullet: false, explode: false,
    freeze: false, lightning: false,
    healPerSec: 0, regen: 0,
    armor: 0, thorns: 0,
    orbitCount: 0,
    dashDmgMult: 1, dashRangeMult: 1,
    hero: hero,
    expRangeMult: 1,
    // 专属状态
    stackingAtkSpd: false, tenStepKill: false, killCounter: 0,
    charm: false, berserk: false, rage: false, ironWall: false,
    freezeTimer: 0, lightningTimer: 0,
  };

  bullets = [];
  enemies = [];
  expOrbs = [];
  particles = [];
  floatingTexts = [];
  selectedCards = [];
  cardHistory = [];
  dashTrails = [];
  orbitals = [];

  spawnTimer = 0;
  spawnInterval = 2.0;
  spawnCount = 4;
  gameTime = 0;
  maxTime = 5 * 60;
  killCount = 0;
  eliteTimer = 0;
  bossSpawned = false;
  difficulty = 1;
  state = 'playing';
}

// ===================== 轨道球 =====================
let orbitals = [];
let dashTrails = [];

// ===================== 子弹 & 攻击 =====================
function shootBullet(tx, ty) {
  const dx = tx - player.x, dy = ty - player.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist === 0) return;
  const spd = 380;
  const bSize = player.bigBullet ? 11 : 6;
  const dmg = player.atk * player.atkMult;

  const count = player.multiShot ? (3 + (player.multiExtra || 0)) : 1;
  if (count > 1) {
    const totalAngle = 20 + (player.multiExtra || 0) * 5;
    const baseAngle = Math.atan2(dy, dx) - totalAngle / 2 * Math.PI / 180;
    for (let i = 0; i < count; i++) {
      const ang = baseAngle + i * (totalAngle / (count - 1 || 1)) * Math.PI / 180;
      bullets.push({
        x: player.x, y: player.y,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        r: bSize * 0.85, dmg, life: 2.5,
        color: player.hero === 'daji' ? '#ff88ff' : (player.hero === 'chengyaojin' ? '#ff8844' : '#88ddff'),
      });
    }
  } else {
    bullets.push({
      x: player.x, y: player.y,
      vx: dx / dist * spd, vy: dy / dist * spd,
      r: bSize, dmg, life: 2.5,
      color: '#fff8aa',
    });
  }
}

// ===================== 冲刺 =====================
function doDash() {
  if (player.dashCD > 0) return;
  player.dashCD = player.dashCooldown;

  let dx = 0, dy = 0;
  if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
  if (dx === 0 && dy === 0) dx = 1;

  const len = Math.sqrt(dx * dx + dy * dy);
  dx /= len; dy /= len;
  const dashDist = 200 * player.dashRangeMult;
  const startX = player.x, startY = player.y;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x + dx * dashDist));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y + dy * dashDist));

  const dashDmg = player.atk * player.atkMult * 1.5 * player.dashDmgMult;

  // 十步一杀
  if (player.tenStepKill && player.killCounter >= 10) {
    // 超强一击
    enemies.forEach(e => {
      const ex = e.x - startX, ey = e.y - startY;
      const fx = player.x - startX, fy = player.y - startY;
      const flen = Math.sqrt(fx * fx + fy * fy);
      if (flen === 0) return;
      const t = Math.max(0, Math.min(1, (ex * fx + ey * fy) / (flen * flen)));
      const closestX = startX + t * fx - e.x;
      const closestY = startY + t * fy - e.y;
      if (Math.sqrt(closestX * closestX + closestY * closestY) < e.r + 60) {
        e.hp -= dashDmg * 5;
        spawnHitParticles(e.x, e.y, '#ff0040', 15);
      }
    });
    player.killCounter = 0;
    addFloatingText(player.x, player.y - 30, '💀 十步一杀！', '#ff0040', 28);
  } else {
    // 普通冲刺伤害
    enemies.forEach(e => {
      const ex = e.x - startX, ey = e.y - startY;
      const fx = player.x - startX, fy = player.y - startY;
      const flen = Math.sqrt(fx * fx + fy * fy);
      if (flen === 0) return;
      const t = Math.max(0, Math.min(1, (ex * fx + ey * fy) / (flen * flen)));
      const closestX = startX + t * fx - e.x;
      const closestY = startY + t * fy - e.y;
      if (Math.sqrt(closestX * closestX + closestY * closestY) < e.r + 25) {
        e.hp -= dashDmg;
      }
    });
  }

  // 残影
  if (player.cloneOnDash) {
    dashTrails.push({ x: startX, y: startY, r: player.r, life: 2.5, maxLife: 2.5, dmg: player.atk * player.atkMult * 0.6 });
  }

  // 粒子
  for (let i = 0; i < 15; i++) {
    const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 1.2;
    const spd = 100 + Math.random() * 200;
    particles.push({
      x: startX + (Math.random() - 0.5) * 20,
      y: startY + (Math.random() - 0.5) * 20,
      vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
      r: 2 + Math.random() * 4, life: 0.6, color: '#88ccff',
    });
  }
}

// ===================== 浮动文字 =====================
function addFloatingText(x, y, text, color, size = 20) {
  floatingTexts.push({ x, y, text, color, size, life: 1.2, maxLife: 1.2, vy: -60 });
}

// ===================== 敌人 =====================
function spawnEnemy(elite = false, boss = false) {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -30; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + 30; }
  else { x = -30; y = Math.random() * H; }

  const hpScale = 1 + (gameTime / 120) * 0.3;

  if (boss) {
    enemies.push({
      x, y, r: 38, hp: 800 * hpScale, maxHp: 800 * hpScale,
      spd: 55, atk: 22, atkTimer: 0, atkCD: 1.2,
      color: '#ff0040', isBoss: true, phase: 1, type: 'boss',
      stunTimer: 0,
    });
  } else if (elite) {
    const eliteTypes = [
      { r: 24, hp: 200 * hpScale, spd: 80, atk: 18, color: '#ff8c00', atkCD: 0.9 },
      { r: 20, hp: 120 * hpScale, spd: 130, atk: 14, color: '#ff44aa', atkCD: 0.7 },
      { r: 28, hp: 350 * hpScale, spd: 50, atk: 25, color: '#8e44ad', atkCD: 1.5 },
    ];
    const t = eliteTypes[Math.floor(Math.random() * eliteTypes.length)];
    enemies.push({ x, y, ...t, maxHp: t.hp, atkTimer: 0, isElite: true, type: 'elite', stunTimer: 0 });
  } else {
    const types = [
      { r: 13, hp: 22 * hpScale, spd: 120 + Math.random() * 30, atk: 8, atkCD: 0.8, color: '#ff4444' },
      { r: 18, hp: 45 * hpScale, spd: 70, atk: 13, atkCD: 1.0, color: '#cc2222' },
      { r: 9,  hp: 14 * hpScale, spd: 170 + Math.random() * 20, atk: 5, atkCD: 0.5, color: '#ff8888' },
    ];
    const t = types[Math.floor(Math.random() * types.length)];
    enemies.push({ x, y, ...t, maxHp: t.hp, atkTimer: 0, type: 'normal', stunTimer: 0 });
  }
}

// ===================== 经验球 =====================
function spawnExpOrb(x, y, val = 3) {
  expOrbs.push({ x, y, val, r: 7, fly: false });
}

// ===================== 粒子 =====================
function spawnHitParticles(x, y, color = '#ffff00', count = 6) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 80 + Math.random() * 150;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
      r: 2 + Math.random() * 4, life: 0.5 + Math.random() * 0.3, color,
    });
  }
}

// ===================== 更新 =====================
function update(dt) {
  if (state !== 'playing') return;

  gameTime += dt;
  if (gameTime >= maxTime) { state = 'win'; return; }

  difficulty = 1 + gameTime / 120;

  // 震动
  if (shakeTimer > 0) { shakeTimer -= dt; shakeX = (Math.random() - 0.5) * shakeTimer * 30; shakeY = (Math.random() - 0.5) * shakeTimer * 30; }
  else { shakeX = 0; shakeY = 0; }
  if (flashTimer > 0) flashTimer -= dt;

  // 玩家移动
  let mvx = 0, mvy = 0;
  if (keys['KeyW'] || keys['ArrowUp']) mvy -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) mvy += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mvx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mvx += 1;
  const mlen = Math.sqrt(mvx * mvx + mvy * mvy);
  if (mlen > 0) { mvx /= mlen; mvy /= mlen; }
  const spd = player.speed * player.speedMult;
  player.x += mvx * spd * dt;
  player.y += mvy * spd * dt;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y));

  // 自动回血
  if (player.regen || player.healPerSec) {
    const healAmt = (player.regen * player.maxHp / 3 * dt) + player.healPerSec * dt;    player.hp = Math.min(player.hp + healAmt, player.maxHp);
 ​}
  // 冲刺CD
  if (player.dashCD > 0) player.dashCD -= dt;

 ​// 自动攻击
  player.atkTimer -= dt;
  if (player.atkTimer <= 0) {
    player.atkTimer = player.atkSpeed * player.atkSpeedMult;
    // 狂暴触发
    if (player.berserk && player.hp / player.maxHp < 0.3) player.atkTimer *= ​0.5;
    let nearest = null, nd = Infinity;
    enemies.forEach(e => {
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < nd) { nd = d; nearest = e; }
    });
    if (nearest) shootBullet(nearest.x, nearest.y);
  }

  // 堆叠攻速
  if (player.stackingAtkSpd) {
    const stacks = Math.floor(killCount / 5);
    const bonus = Math.min(stacks * 0.02, 0.4);
    player.atkSpeedMult = 1 / (1 + bonus);
  }

  // 冰冻
 ​if (player.freeze) {
    player.freezeTimer -= dt;
    if (player.freezeTimer <= 0) {
      player.freezeTimer = ​10;
      enemies.forEach(e => e.stunTimer = 1.5);
      addFloatingText(player.x, player.y - 30, '❄️ 冰冻全场!', '#00bfff', ​24);
      spawnHitParticles(player.x, player.y, '#00bfff', ​20);
    }
 ​}

 ​// 闪电
 ​if (player.lightning) {
    player.lightningTimer -= dt;
    if (player.lightningTimer <= 0) {
      player.lightningTimer = 8;
      if (enemies.length > 0) {
        // 找最近的3个敌人连锁
        const sorted = [...enemies].sort((a, b) => Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y));
        for (let i = 0; i < Math.min(3, sorted.length); i++) {
          const e = sorted[i];
          e.hp -= player.atk * player.atkMult * 1.5;
          spawnHitParticles(e.x, e.y, '#f1c40f', 8);
        }
        addFloatingText(player.x, player.y - 50, '⚡ 雷霆！', '#f1c40f', 26);
      }
    }
  }

  // 子弹更新
  bullets = bullets.filter(b => b.life > 0);
  bullets.forEach(b => {
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) b.life = 0;
    enemies.forEach(e => {
      if (b.life <= 0) return;
      if (Math.hypot(b.x - e.x, b.y - e.y) < b.r + e.r) {
        e.hp -= b.dmg;
        b.life = 0;
        spawnHitParticles(e.x, e.y, '#ffdd00', 3);
        // 魅惑
        if (player.charm && Math.random() < 0.15) e.stunTimer = 1;
      }
    });
  });

  // 残影
  dashTrails.forEach(t => {
    t.life -= dt;
    enemies.forEach(e => {
      if (Math.hypot(t.x - e.x, t.y - e.y) < t.r + e.r) {
        e.hp -= t.dmg * dt * 2;
      }
    });
  });
  dashTrails = dashTrails.filter(t => t.life > 0);

  // 轨道球
 ​if (player.orbitCount) {
    while (orbitals.length < player.orbitCount) {
      orbitals.push({ angle: Math.random() * Math.PI * 2, speed: 2 + Math.random() });
    ​}
    orbitals.forEach((o, i) => {
      o.angle += o.speed * dt;
      const dist = 50 + i * 8;
      const ox = player.x + Math.cos(o.angle) * dist;
      const oy = player.y + Math.sin(o.angle) * dist;
      enemies.forEach(e => {
        if (Math.hypot(ox - e.x, oy - e.y) < e.r + 10) {
          e.hp -= player.atk * player.atkMult * 0.5 * dt * 3;
          spawnHitParticles(ox, oy, '#f1c40f', 2);
        }
      });
      // 画在绘制里
    }));
  }

  // 刷怪
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = spawnInterval;
    for (let i = 0; i < spawnCount; i++) spawnEnemy();
    if (gameTime > 20 && Math.floor(gameTime / 15) > Math.floor((gameTime - dt) / 15)) {
      spawnCount = Math.min(spawnCount + 1, 18);
    }
    if (gameTime > 60) spawnInterval = Math.max(spawnInterval - 0.03, 0.8);
  }

  // 精英
  eliteTimer += dt;
  if (eliteTimer >= 90) { eliteTimer = 0; spawnEnemy(true); }

  // BOSS
  if (!bossSpawned && gameTime >= 240) { bossSpawned = true; spawnEnemy(false, true); }

  // 敌人行为
 ​enemies.forEach(e => {
    if (e.stunTimer > 0) { e.stunTimer -= dt; return; }

    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);

    // BOSS分阶段
    if (e.isBoss && e.hp < e.maxHp * 0.4 && e.phase === 1) { e.phase = 2; e.spd = 100; e.atkCD = 0.8; e.color = '#ff0080'; addFloatingText(e.x, e.y - 40, '⚠️ 狂暴阶段!', '#ff0080', ​22); }
    if (e.isBoss && e.hp < e.maxHp * ​0.15 && e.phase === 2) { e.phase = 3; e.spd = 130; e.atk = 30; e.color = '#ff00ff'; addFloatingText(e.x, e.y - 40 , '💀 最终阶段!!', '#ff00ff', ​26); }

    if (dist > e.r) {
      e.x += dx / dist * e.spd * dt;
      e.y += dy / dist * e.spd * dt;
    }

    // ​ 攻击玩家
    e.atkTimer -= dt;
    if (dist < e.r + player.r + 8 && e.atkTimer <= ​0) {
      e.atkTimer = e.atkCD;
      let dmg = e.atk * (1 - (player.armor || 0);
      player.hp -= dmg;
      // 反伤
      if (player.thorns) { e.hp -= dmg * player.thorns; }
      shakeTimer = 0.12;
      if (player.hp <= 0) { state = 'gameover'; }
    }
  });

  // 死亡处理
  const dead = enemies.filter(e => e.hp <= 0);
  dead.forEach(e => {
    killCount++;
    const expVal = e.isElite ? 15 : e.isBoss ? 60 : 3;
    spawnExpOrb(e.x, e.y, expVal);
    spawnHitParticles(e.x, e.y, e.color, e.isBoss ? 30 : e.isElite ? ​15 : 8);
    shakeTimer = e.isBoss ? ​0.3 : ​0.08;
    // 吸血
    if (player.lifesteal) { player.hp = Math.min(player.hp + player.lifesteal, player.maxHp); }
    // 爆炸
    if (player.explode) {
      enemies.forEach(other => {
        if (other !== e && Math.hypot(other.x - e.x, other.y - e.y) < 80) {
          other.hp -= player.atk * player.atkMult * 0.8;
        }
      });
      spawnHitParticles(e.x, e.y, '#ff6600', ​20);
    }
    // ​ 十步一杀计数
    if (player.tenStepKill) player.killCounter++;
    // 愤怒叠加
    if (player.rage) {
      player.rageTimer = 3;
      player.rageAtk = (player.rageAtk || 0) + 0.05;
    }
 ​});
  enemies = enemies.filter(e => e.hp > 0);

  // 经验球
 ​expOrbs.forEach(o => {
    const dx = player.x - o.x, dy = player.y - o.y;
    const dist = Math.hypot(dx, dy);
    const attractRange = 100 * (player.expRangeMult || 1);
    if (dist < attractRange) {
      o.fly = true;
      o.x += dx / dist * 500 * dt;
      o.y += dy / dist * 500 * dt;
    }
    if (Math.hypot(o.x - player.x, o.y - player.y) < player.r + o.r) {
      o.collected = true;
      player.exp += o.val;
      while (player.exp >= player.expNext) {
        player.exp -= player.expNext;
        player.level++;
        player.expNext = Math.floor(player.expNext * 1.5);
        const cards = getRandomCards(player.hero);
        if (cards.length > 0) {
          window._pendingCards = cards;
          state = 'levelup';
          flashTimer = 0.4;
        }
      }
    }
  });
 ​expOrbs = expOrbs.filter(o => !o.collected);

  // 粒子
  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
  particles = particles.filter(p => p.life > ​0);

  // 浮动文字
  floatingTexts.forEach(t => { t.y += t.vy * dt; t.life -= dt; });
  floatingTexts = floatingTexts.filter(t => t.life > 0);
}

function drawEnemies() {
  enemies.forEach(e => {
    ctx.save();

    // BOSS血条
    if (e.isBoss || e.isElite) {
      const bw = 60 * (e.isBoss ? 1.5 : 1);
      const bx = e.x - bw / 2, by = e.y - e.r - 12;
      // 背景
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx, by, bw, 6);
      // 血量
      const ratio = e.hp / e.maxHp;
      ctx.fillStyle = ratio > 0.5 ? '#4ecdc4' : ratio > 0.25 ? '#f39c12' : '#e74c3c';
      ctx.fillRect(bx, by, bw * ratio, 6);
      // 边框
      ctx.strokeStyle = '#fff22';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, 6);
    }

    // 闪光
    if (e.stunTimer > 0) {
      ctx.fillStyle = `rgba(0, 191, 255, ${0.3 * Math.sin(e.stunTimer * 10) + 0.3})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.shadowColor = e.color;
    ctx.shadowBlur = e.isBoss ? 25 : e.isElite ? 12 : 4;

    if (e.isBoss) {
      // BOSS - 六边形
      const rot = frameCount * 0.01;
      ctx.fillStyle = e.color;
      ctx.beginPath();
      for (let i = ​0; i < ​6; i++) {
        const ang = i / 6 * Math.PI * ​2 + rot;
        ctx.lineTo(e.x + Math.cos(ang) * e.r, e.y + Math.sin(ang) * e.r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#fff88';
      ctx.lineWidth = 2;
      ctx.stroke();
      // BOSS 图标
      ctx.fillStyle = '#fff';
      ctx.font = '14px Microsoft YaHei';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 0;
      ctx.fillText('铠', e.x, e.y + 5);
    } else if (e.isElite) {
      // ​ 精英 - 钻石
      const rot = frameCount * 0.02;
      ctx.fillStyle = e.color;
      ctx.beginPath();
      for (let i = ​0; i < ​4; i++) {
        const ang = i / 4 * Math.PI * ​2 + Math.PI / 4 + rot;
        ctx.lineTo(e.x + Math.cos(ang) * e.r, e.y + Math.sin(ang) * e.r);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      // ​ 普通 - 三角形（指向玩家）
      const ang = Math.atan2(player.y - e.y, player.x - e.x);
      const s = e.r;
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.moveTo(e.x + Math.cos(ang) * s, e.y + Math.sin(ang) * s);
      ctx.lineTo(e.x + Math.cos(ang + 2.4) * s * 0.7, e.y + Math.sin(ang + 2.4) * s * 0.7);
      ctx.lineTo(e.x + Math.cos(ang - 2.4) * s * 0.7, e.y + Math.sin(ang - 2.4) * s * 0.7);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  });
}

      ctx.fillStyle = c.color;
      ctx.font = '12px Noto Sans SC';
      ctx.fillText(`${c.icon} ${c.name}`, cx, cy);
    });
    ctx.textAlign = 'center';
  }

  // 重玩按钮
  const bx = W / 2 - 90, by = H / 2 + 190;
  const hover = _hoverBtn && _hoverBtn === 'restart';
  ctx.fillStyle = hover ? '#4488ff' : '#3399ff';
  roundRect(ctx, bx, by, 180, 46, 10);  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px Noto Sans SC';
  ctx.fillText('🔄 再来一局', W / 2, by + 31);
}

let _hoverBtn = null;

// ===================== 选卡界面 ================
function drawLevelUp() {
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);

  // 标题
  ctx.fillStyle = '#f7dc6f';
  ctx.shadowColor = '#f7dc6f';
  ctx.shadowBlur = 20;
  ctx.font = 'bold 28px Noto Sans SC';
  ctx.textAlign = 'center';
  ctx.fillText('⚡ 等级提升！选择增益', W / 2, 90);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#888';
  ctx.font = '14px Noto Sans SC';
  ctx.fillText('点击卡牌选择，或按 1 / 2 / 3 键', W / 2, 118);

 ​const cards = window._pendingCards || [];
  cards.forEach((c, i) => {
    const cx = W / 2 - 340 + i * 230, cy = 145;
    const hover = _hoverCard === i;
    const scale = hover ? 1.05 : 1;

    ctx.save();
    ctx.translate(cx + 105, cy + 120);
    ctx.scale(scale, scale);
    ctx.translate(-( cx + 105), -(cy + 120));

    // 稀有度边框颜色
    const tierColors = { common: '#666', rare: '#3399ff', epic: '#9b59b6', legendary: '#f1c40f' };
    const tierNames = { common: '普通', rare: '稀有', epic: '史诗', legendary: '传说' };
    const bColor = tierColors[c.tier] || '#666';

    // 卡牌背景
    ctx.fillStyle = hover ? '#1a1a4a' : '#0f0f30';
    ctx.strokeStyle = hover ? bColor : bColor + '66';
    ctx.lineWidth = hover ? 3 : 1.5;
    roundRect(ctx, cx, cy, 210, 240, 10);  ctx.fill();  ctx.stroke();

    // 顶部色块
    ctx.fillStyle = c.color + '33';
    roundRect(ctx, cx, cy, 210, 75, 10, true);  ctx.fill();

    // 图标（大号）
    ctx.fillStyle = '#fff';
    ctx.font = '40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(c.icon, cx + 105, cy + 50);

    // 名字
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Noto Sans SC';
    ctx.fillText(c.name, cx + 105, cy + 98);

    // 稀有度标签
    ctx.fillStyle = bColor;
    ctx.font = '11px Noto Sans SC';
    ctx.fillText(tierNames[c.tier] || '', cx + 105, cy + 118);

    // 描述
    ctx.fillStyle = '#bbb';
    ctx.font = '13px Noto Sans SC';
    const descLines = c.desc.split('，');
    descLines.forEach((line, li) => ctx.fillText(line, cx + 105, cy + 142 + li * 20));

    // ​ 序号
    ctx.fillStyle = '#666';
    ctx.font = '12px Noto Sans SC';
    ctx.fillText(`[ ${i + 1} ]`, cx + 105, cy + 225);

    // ​ 英雄专属标签
    const allHeroCards = Object.values(HERO_SPECIFIC).flat();
    if (allHeroCards.some(hc => hc.id === c.id)) {
      ctx.fillStyle = '#f7dc6f88';
      ctx.font = '10px Noto Sans SC';
      ctx.fillText('★ 专属', cx + 105, cy + 212);
    }

    ctx.restore();
  });
}

let _hoverCard = -1;

// ===================== 鼠标交互 =====================
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  _hoverCard = -1;
  _hoverBtn = null;

  if (state === 'levelup') {
    const cards = window._pendingCards || [];
    cards.forEach((c, i) => {
      const cx = W / 2 - 340 + i * 230, cy = 145;
      if (mx > cx && mx < cx + 210 && my > cy && my < cy + 240) _hoverCard = i;
    });
  }

  if (state === 'gameover' || state === 'win') {
    const bx = W / 2 - 90, by = H / 2 + 190;
    if (mx > bx && mx < bx + 180 && my > by && my < by + 46) _hoverBtn = 'restart';
  }
});

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);

  if (state === 'menu') {
    initGame();
    return;
  }

 ​if (state === 'gameover' || state === 'win') {
    const bx = W / 2 - 90, by = H / 2 + 190;
    if (mx > bx && mx < bx + 180 && my > by && my < by + 46) {
      // ​ 重置游戏
      document.getElementById('heroSelect').style.display = 'block';

    }
 ​}

 ​if (state === 'levelup') {
    const cards = window._pendingCards || [];
    cards.forEach((c, i) => {
      const cx = W / 2 - 340 + i * 230, cy = 145;
      if (mx > cx && mx < cx + 210 && my > cy && my < cy + 240) {
        c.apply(player);
        selectedCards.push(c);
        if (selectedCards.length > 12) selectedCards.shift();
        state = 'playing';
        addFloatingText(player.x, player.y - 40, c.name, c.color, 22);
      }
    }));
  }
});

// 键盘选卡
document.addEventListener('keydown', e => {
  if (state === 'levelup') {
    const cards = window._pendingCards || [];
    const map = { 'Digit1': 0, 'Numpad1': 0, 'Digit2': 1, 'Numpad2': 1, 'Digit3': 2, 'Numpad3': 2 };
    if (e.code in map) {
      const idx = map[e.code];
      if (cards[idx]) {
        cards[idx].apply(player);
        selectedCards.push(cards[idx]);
        if (selectedCards.length > 12) selectedCards.shift();
        state = 'playing';
        addFloatingText(player.x, player.y - 40, cards[idx].name, cards[idx].color, 22);
      }
    }
  }
  if (state === 'playing' && e.code === 'Space') { e.preventDefault(); doDash(); }
});

// ===================== 工具函数 =====================
function roundRect(ctx, x, y, w, h, r, topOnly = false) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  if (topOnly) {
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + r);
  } else {
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  }
  ctx.lineTo(x, y + r);
 ​ctx.quadraticCurveTo(x, y, x + r, y);
 ​ctx.closePath();
}

// ===================== 主菜单 ======================
function drawMenu() {
  drawBg();

  // 标题
  ctx.shadowColor = '#4488ff';
  ctx.shadowBlur = 40;
  ctx.fillStyle = '#4488ff';
  ctx.font = 'bold 56px Noto Sans SC';
  ctx.textAlign = 'center';
  ctx.fillText('混沌夺宝', W / 2, 180);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#88aaff';
  ctx.font = '18px Noto Sans SC';
  ctx.fillText('在混沌中生存，在夺宝中成神', W / 2, 220);

  // 英雄选择
  ctx.fillStyle = '#aaa';

  ctx.fillText('选择你的英雄', W / 2, 290);

  const heroes = [

    ctx.lineWidth = sel ? ​3 : ​1;
    roundRect(ctx, cx, cy, 240, 200, 12);  ctx.fill();  ctx.stroke();

    // 颜色条纹
    ctx.fillStyle = h.color + '33';
    roundRect(ctx, cx, cy, 240, 50, 12, true);  ctx.fill();

    // 图标

    ctx.font = '44px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(h.icon, cx + 120, cy + 38);

    // 名字
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Noto Sans SC';
    ctx.fillText(h.name, cx + 120 , cy + 78);

    // ​ 称号
    ctx.fillStyle = '#888';
    ctx.font = '13px Noto Sans SC';
    ctx.fillText(h.title, cx + 120 , cy + 100);

    // ​ 描述
    ctx.fillStyle = '#aaa';
    ctx.font = '12px Noto Sans SC';
    ctx.fillText(h.desc, cx + 120 , cy + 125);

    // ​ 专属卡数
    const specCount = (HERO_SPECIFIC[h.id] || []).length;
    ctx.fillStyle = '#f7dc6f88';
    ctx.font = '11px Noto Sans SC';
    ctx.fillText(`★ ${specCount}张专属增益`, cx + 120 , cy + 155);

    // ​ 选中标记
    if (sel) {
      ctx.fillStyle = h.color;
      ctx.font = '14px Noto Sans SC';
      ctx.fillText('✓ 已选', cx + 120 , cy + 180);
    }

    ctx.restore();
  });

  // 操作说明
  ctx.fillStyle = '#666';
 ​ctx.font = '13px Noto Sans SC';
  ctx.fillText('WASD 移动  |  空格 冲刺技能  |  击杀升级选择增益  |  坚持 5 分钟', W / 2, 570);

 ​ctx.fillStyle = '#888';
  ctx.font = '13px Noto Sans SC';
  ctx.fillText('普通三角形 → 精英钻石 ◆ → 首领六边形 �', W / 2, 598);

  // 开始按钮
  const bx = W / 2 - 110, by = 620;
  const btnHover = _hoverBtn === 'start';
  ctx.fillStyle = btnHover ? '#4488ff' : '#3399ff';
  roundRect(ctx, bx, by, 220, 48, 12);  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px Noto Sans SC';
  ctx.textAlign = 'center';
  ctx.fillText('⚔ 开始战斗', W / 2, by + 33);
  ctx.textAlign = 'left';
}

let _hoverHero = -1;
let _selectedHero = 0;

// ===================== 主循环 ================
let lastTime = 0;

function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  frameCount++;

  if (state === 'menu') {
    drawMenu();
  } else if (state === 'playing' || state === 'levelup') {
    update(dt);
    // 绘制
    ctx.save();
    ctx.translate(shakeX, shakeY);
    drawBg();
    drawExpOrbs();
    drawOrbitals();
    drawEnemies();
    drawBullets();
    drawPlayer();
    // 粒子
    particles.forEach(p => {
      const alpha = Math.min(1, p.life / 0.5);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    // 浮动文字
    floatingTexts.forEach(t => {
      const alpha = Math.min(1, t.life / t.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = t.color;
      ctx.font = `bold ${t.size}px Noto Sans SC`;
      ctx.textAlign = 'center';
      ctx.fillText(t.text, t.x, t.y);
    });
    ctx.globalAlpha = 1;
    // 闪光
    if (flashTimer > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashTimer * 1.5})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
    drawHUD();
    if (state === 'levelup') drawLevelUp();
  } else if (state === 'gameover' || state === 'win') {
    // 最后帧绘制冻结
    drawBg();
    drawExpOrbs();
    drawOrbitals();
    drawEnemies();
    drawBullets();
    drawPlayer();
    particles.forEach(p => { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); });
    drawEnd(state === 'win');
  }

  requestAnimationFrame(loop);
}

// 菜单点击
canvas.addEventListener('click', menuClickHandler = e => {
  if (state !== 'menu') return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);

  // 英雄选择
  const heroes = ['libai', 'daji', 'chengyaojin'];
  heroes.forEach((id, i) => {
    const cx = W / 2 - 280 + i * 280, cy = 320;
    if (mx > cx && mx < cx + 240 && my > cy && my < cy + 200) {
      _selectedHero = i;
    }
  });

  // 开始按钮
  const bx = W / 2 - 110, by = 620;
  if (mx > bx && mx < bx + 220 && my > by && my < by + 48) {
    document.getElementById('heroSelect').style.display = 'none';
    initGame();
  }
});

canvas.addEventListener('mousemove', menuMoveHandler = e => {
  if (state !== 'menu') return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);

  _hoverHero = -1;
  const heroes = ['libai', 'daji', 'chengyaojin'];
  heroes.forEach((id, i) => {
    const cx = W / 2 - 280 + i * 280, cy = 320;
    if (mx > cx && mx < cx + 240 && my > cy && my < cy + 200) _hoverHero = i;
  });

  const bx = W / 2 - 110, by = 620;
  _hoverBtn = (mx > bx && mx < bx + 220 && my > by && my < by + 48) ? 'start' : null;
});

// 启动
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
</script>
